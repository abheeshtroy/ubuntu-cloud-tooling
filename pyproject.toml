[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ubuntu-cloud-tooling"
version = "0.1.0"
description = "Reproducible apt-based Ubuntu system configuration tool with idempotent package and source management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abheesht Roy", email = "abheeshtr11@gmail.com" }
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cloudtool = "cloudtool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]