# Generated by ubuntu-cloud-tooling
# Prompt: Node.js 20 web server with nginx and postgres

system:
  name: nodejs-webdev
  ubuntu_version: "22.04"
  update_cache: true
  upgrade: false

apt_sources:
  - name: nodesource
    uri: https://deb.nodesource.com/node_20.x
    distribution: jammy
    components: [main]
    key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    enabled: true
  - name: pgdg
    uri: https://apt.postgresql.org/pub/repos/apt
    distribution: jammy-pgdg
    components: [main]
    key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    enabled: true

packages:
  - name: nodejs
  - name: postgresql-16
  - name: postgresql-client-16
  - name: libpq-dev
  - name: nginx
  - name: curl
  - name: wget
  - name: vim
  - name: htop
  - name: unzip
  - name: ca-certificates
  - name: gnupg
